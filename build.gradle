plugins {
    id 'java'
    id 'checkstyle'
}

group = 'com.vowtaker'
version = '1.0.1'

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.runelite.net')
    }
}

def runeLiteVersion = 'latest.release'
// Must match the Gson the client ships, or newer APIs compile then fail at runtime.
def gsonVersion = '2.8.5'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly group: 'com.google.code.gson', name: 'gson', version: gsonVersion
    compileOnly 'javax.inject:javax.inject:1'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'com.google.code.gson', name: 'gson', version: gsonVersion
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

jar {
    manifest {
        attributes(
            'Plugin-Class': 'com.vowtaker.VowTakerPlugin',
            'Plugin-Id': 'vowtaker',
            'Plugin-Version': version
        )
    }
}
